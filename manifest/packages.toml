# ================================================================
# dotf Provisioning Manifest
# ================================================================
# The manifest embedded into the dotf CLI binary via embed.go
# (//go:embed manifest/*.toml). It provisions the daily-driver toolset by
# default (base + dev) and the full legacy bootstrap.sh tool set through opt-in
# intents (runtimes, ai, cloud, git-tools) — see #31. It defines:
#   - [intents.<name>]   named, user-selectable bundles of packages
#   - [[package]]         installable units, one entry per supported backend
#   - [[symlink]]         dotfiles-to-$HOME mappings, ported from
#                          playbooks/vars/symlinks.yml
#
# Schema contract: internal/manifest/types.go (Manifest/Intent/Package/
# Symlink/Backend). Keep this file in sync with that package — it is the
# frozen source of truth for field names and the Backend values
# (pkg, github-release, aur, toolchain, repo, script-url,
# custom-script, git-clone, font).
#
# The `names` table on a [[package]] maps a platform.PkgMgr key
# (internal/platform/types.go) to the package name used by that manager.
# Only "pacman", "apt", "dnf", "homebrew", "yum", and "zypper" are valid
# keys — except for toolchain packages, which instead key the install
# identifier by tool ("cargo", "npm"), e.g. names = { cargo = "ripgrep" }
# when the crate name differs from the binary name.

# ================================================================
# INTENTS
# ================================================================
# Named bundles a user opts into during provisioning. `default = true`
# pre-selects the intent in the interactive TUI.

[intents.base]
description = "Minimal baseline tools for any machine"
default = true
packages = ["ripgrep", "starship"]


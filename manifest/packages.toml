[[package]]
name = "playwright-cli"
backend = "custom-script"
script = "bin/install-playwright-cli.sh"
provides = ["playwright-cli"]
actions = ["update", "remove"]
class = "rolling"
justification = "npm global install of the latest package version (PLAYWRIGHT_CLI_VERSION defaults to latest)"


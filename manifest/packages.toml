# Shell plugins + Ruby/Python tooling. Names are real package-manager tokens
# only (Debian madison / Ubuntu Packages.gz / Arch search API / Homebrew
# formulae API / openSUSE Tumbleweed OSS primary.xml / local `dnf list`).
# common/tools.sh already probes the distro and Homebrew zsh plugin paths.
#
# Arch and Homebrew ship Ruby headers inside `ruby` itself (no ruby-devel /
# ruby-dev package), so those managers map ruby-devel to `ruby` — idempotent
# with --needed / brew install when the ruby entry already ran.
#
# openSUSE Tumbleweed OSS has no zsh-autosuggestions / zsh-syntax-highlighting
# and only version-suffixed python3XX-{black,ruff} (no stable metapackage), so

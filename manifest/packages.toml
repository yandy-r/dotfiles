[[package]]
name = "ruby-devel"
backend = "pkg"
names = { pacman = "ruby", apt = "ruby-dev", dnf = "ruby-devel", homebrew = "ruby", zypper = "ruby-devel" }

[[package]]
name = "zsh-autosuggestions"

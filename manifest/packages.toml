os = "macos"
names = { homebrew = "zsh-autosuggestions" }

[[package]]
name = "zsh-syntax-highlighting"
backend = "pkg"
os = "linux"
names = { pacman = "zsh-syntax-highlighting", apt = "zsh-syntax-highlighting", dnf = "zsh-syntax-highlighting" }

[[package]]
name = "zsh-syntax-highlighting-macos"
backend = "pkg"
os = "macos"
names = { homebrew = "zsh-syntax-highlighting" }

[[package]]
name = "black"
backend = "pkg"
os = "linux"
names = { pacman = "python-black", apt = "black", dnf = "black" }

[[package]]
name = "black-macos"
backend = "pkg"
os = "macos"
names = { homebrew = "black" }

[[package]]
name = "kate"
backend = "pkg"
names = { pacman = "kate", apt = "kate", dnf = "kate", homebrew = "kate", zypper = "kate" }

[[package]]
name = "ruff"
backend = "pkg"
os = "linux"
names = { pacman = "ruff", apt = "ruff", dnf = "ruff" }

[[package]]
name = "ruff-macos"

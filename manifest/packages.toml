name = "neon"
backend = "toolchain"
tool = "npm"
names = { npm = "neonctl" }
provides = ["neon"]

# 1Password CLI (`op`). One entry covers every dotf OS: Homebrew cask on macOS,
# winget on Windows, and on Linux/WSL the official release zip GPG-verified
# against the pinned 1Password signing key, installed setgid `onepassword-cli`
# (the desktop-app integration requires that group). Not `repo`: 1Password
# ships apt/dnf repos only, leaving Arch/openSUSE uncovered, and the
# github-release backend cannot express the CDN zip + detached-signature check
# or the group/setgid step.
[[package]]
name = "1password-cli"
backend = "custom-script"
script = "bin/install-1password-cli.sh"
provides = ["op"]
actions = ["update", "remove"]
class = "rolling"
justification = "official 1Password CDN release (GPG-verified) tracks latest; brew cask / winget on macOS / Windows"

# git-tools intent
[[package]]
name = "tea"
backend = "custom-script"
script = "bin/install-tea.sh"
provides = ["tea"]
class = "rolling"
justification = "installs the latest published tea release resolved via the Gitea API"

# lefthook ships the `lefthook` binary as the npm package of the same name (its
# primary cross-platform path); the native toolchain/npm backend replaces
# bin/install-lefthook.sh. toolchain infers class = managed.
[[package]]
name = "lefthook"
backend = "toolchain"
tool = "npm"

# system intent — setup steps that have no package-manager analog
# tpm is a native git-clone: the clone into ~/.tmux/plugins/tpm IS the whole
# install (no PATH binary, no post_install). The dest doubles as the intrinsic
# probe, so status/diff/apply tell the truth and a re-apply skips the already-
# cloned plugin manager; git-clone infers class = managed (see class.go).
[[package]]
name = "tpm"
backend = "git-clone"
url = "https://github.com/tmux-plugins/tpm"
dest = ".tmux/plugins/tpm"

# The installed binary is `tms`, not the package name `tmux-sessionizer`, so the
# default LookPath("tmux-sessionizer") probe would never resolve.
[[package]]
name = "tmux-sessionizer"
backend = "custom-script"
script = "bin/install-tmux-sessionizer.sh"
provides = ["tms"]
class = "managed"
justification = "installed via cargo (toolchain manager), which owns versioning"

# The installer is a hard no-op off macOS (uname != Darwin): its GNU brew
# formulae expose g-prefixed binaries that only exist on macOS Homebrew (on
# Linux these tools are the system default and unprefixed). The `os = "macos"`
# gate scopes the package to macOS so status/diff/apply only evaluate the
# sentinel there — without it the g-prefixed probe would always miss on Linux
# and report a never-installed no-op. `provides` names representative g-prefixed
# binaries from the headline formulae (coreutils→gls, gnu-sed→gsed, gnu-tar→gtar,
# grep→ggrep), each of which is Homebrew-macOS-only.
[[package]]
name = "gnu-utilities"
backend = "custom-script"
script = "bin/install-gnu-utilities.sh"
os = "macos"
provides = ["gls", "gsed", "gtar", "ggrep"]
class = "managed"
justification = "installed via Homebrew on macOS, which owns versioning"

# ================================================================
# SYMLINKS
# ================================================================
# Dotfiles-to-$HOME mappings, ported from playbooks/vars/symlinks.yml.
# `type` mirrors the Ansible {src,dest,type} contract; `os` restricts a
# symlink to a specific platform.OS value (empty applies everywhere).

[[symlink]]
src = "starship.toml"
dest = ".config/starship.toml"

[[symlink]]
src = "nvim"
dest = ".config/nvim"
type = "directory"

[[symlink]]
src = "wezterm"
dest = ".config/wezterm"
type = "directory"

[[symlink]]
src = "espanso"
dest = ".config/espanso"
type = "directory"

[[symlink]]
src = "aerospace"
dest = ".config/aerospace"
type = "directory"
os = "macos"

# ================================================================
# SETUP MODULES
# ================================================================
# A [[module]] is a named setup bundle opted into via `dotf setup <name>`. Each
# is an ordered pipeline of TYPED steps — every step dispatches to one of the
# shipped engines (symlink / pkg / sysconfig / custom-script), so `setup` is a
# typed orchestrator over existing primitives, never a second free-form shell
# escape hatch. These two seeds wrap the retained interactive setup scripts under
# bin/. (The multi-step `ssh` module — symlink + firewall — is gated on #34 and
# is intentionally NOT seeded here.)

# The PAM fingerprint setup targets the Arch/CachyOS host; there is no supported
# Linux fingerprint stack on Apple Silicon, so the module is gated off elsewhere.
[[module]]
name = "fingerprint"
description = "PAM fingerprint auth for sudo/polkit"
os = "arch"
steps = [{ custom-script = "bin/setup-fingerprint.sh" }]

[[module]]
name = "onedrive"
description = "OneDrive/SharePoint client setup"
steps = [{ custom-script = "bin/onedrive-main-setup.sh" }]

# ================================================================
# SYSTEM CONFIG (optional)
# ================================================================
# The [sysconfig] table holds repo-wide OS-level defaults consumed by
# `dotf sysconfig` (hostname/timezone/locale/shell/firewall per-OS). It is
# shipped COMMENTED OUT so a bare `dotf sysconfig` (no flags) leaves every
# domain unmanaged — no destructive shipped default. Uncomment and edit it in
# your own manifest, or pass flags (--timezone/--locale/--shell/--firewall).
#
# hostname is intentionally NOT a field here: it is inherently per-machine and
# supplied only by the --hostname flag.
#
# [sysconfig]
# timezone = "America/New_York"   # IANA Area/City
# locale   = "en_US.UTF-8"        # LANG value (Linux only; macOS = no-op)
# shell    = "zsh"                # login shell name or absolute path
# firewall = "auto"              # ufw | firewalld | auto | off


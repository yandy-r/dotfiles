# turso ships per-target tar.gz archives plus a combined checksums.txt sidecar;
# the native github-release backend auto-detects the host asset and verifies its
# sha256 from the sidecar, replacing bin/install-turso.sh. `binary` names the
# extracted executable (asset is turso-cli_<OS>_<arch>.tar.gz). github-release
# infers class = pinned, so the host artifact is frozen in manifest/dotf.lock
# (run `dotf lock` to add other targets); a lock miss still verifies via the
# sidecar, so installs stay reproducible + checksum-verified.
[[package]]
name = "turso"
backend = "github-release"
repo = "tursodatabase/turso-cli"
tag = "v1.0.29"
binary = "turso"
checksums_asset = "checksums.txt"


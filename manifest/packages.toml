# codex ships the `codex` binary as the npm package @openai/codex, which is its
# primary Linux install path; the native toolchain/npm backend replaces
# bin/install-codex.sh. `names` maps the npm install identifier while `name`
# (codex) doubles as the PATH probe. toolchain infers class = managed.
[[package]]
name = "codex"
backend = "toolchain"
tool = "npm"
names = { npm = "@openai/codex" }

# OpenCode 2 replaces OpenCode 1 under the same `opencode` binary name, so there
# is no side-by-side entry any more. The installer removes a V1 package install
# (brew opencode / npm opencode-ai / AUR opencode-bin) while leaving
# ~/.config/opencode and OpenCode data in place — V2 reads and migrates them —
# and then installs V2 with the official per-OS method (brew
# anomalyco/tap/opencode-v2, AUR opencode-beta, https://opencode.ai/v2/install,
# npm @opencode/cli). A toolchain/npm entry cannot express that V1 removal step,
# so this stays a custom-script package.
#
# The probe is a V2 marker, not `provides = ["opencode"]`: V1 and V2 share the
# `opencode` binary name, so a PATH probe would report a V1 host as converged and
# `dotf apply` would skip the migration. The installer writes the marker only
# after verifying a V2 binary, as a symlink to that binary — so an external
# package-manager uninstall leaves a dangling link that probes as absent — and
# clears it on remove.
[[package]]
name = "opencode"
backend = "custom-script"
script = "bin/install-opencode.sh"
installed_when = { path = "~/.local/state/dotf/opencode-v2" }
actions = ["update", "remove"]
class = "rolling"
justification = "vendor installer tracks latest (OPENCODE_VERSION defaults to latest)"

# fabric installs a binary whose name varies by platform: `fabric` via the
# official installer / `go install .../cmd/fabric`, or `fabric-ai` via Homebrew
# (macOS) and the AUR (Arch). The all-present `provides` model can't express
# that, so an any-of `provides_any` names both candidates — installed when
# EITHER resolves on PATH.
[[package]]
name = "fabric"
backend = "custom-script"
script = "bin/install-fabric.sh"
provides_any = ["fabric", "fabric-ai"]
actions = ["update", "remove"]
class = "rolling"
justification = "go install of the latest package version"

[[package]]
name = "coderabbit"
backend = "custom-script"
script = "bin/install-coderabbit.sh"
provides = ["coderabbit"]
actions = ["remove"]
class = "rolling"
justification = "vendor curl installer tracks latest"

# playwright-cli installs the npm package @playwright/cli AND fans its bundled
# agent skill out to the per-agent skill directories (Claude's ~/.claude/skills,
# the shared ~/.agents/skills that Codex/Cursor/Cursor Agent/OpenCode read, and
# Antigravity's ~/.gemini/antigravity/skills). The upstream `playwright-cli
# install --skills` only writes .claude or .agents, so a toolchain/npm entry

# ================================================================
# PACKAGES
# ================================================================
# Every name referenced above in an intent's `packages` array MUST exist
# as a [[package]].name, and package names MUST be unique across the whole
# manifest. Commented-out reference examples document the backends the
# default set does not currently use.

# --- pkg: installed via the host's native package manager -------------
# The modern-CLI toolset the shared shell configuration (common/tools.sh,
# common/aliases.sh) depends on. The `names` table IS the applicability
# declaration: internal/backend/pkg.go's applicableFor makes an entry applicable
# exactly where it declares a name for the host's package manager, so a manager
# whose distro genuinely does not package the tool is OMITTED, never invented —
# the entry reports applicable=false there instead of aborting the run. Any tool
# omitted for some manager MUST be covered by a sibling entry on another backend
# (see lazygit-bin / yazi-bin / yazi-debian-bin below); that reachability contract is enforced by
# TestEmbeddedManifest_ToolsReachableOnSupportedManagers. apt's fdfind/batcat
# binary renames are irrelevant here because installs are detected via
# package-manager query, not a PATH probe.
[[package]]
name = "ripgrep"
backend = "pkg"
names = { pacman = "ripgrep", apt = "ripgrep", dnf = "ripgrep", homebrew = "ripgrep", zypper = "ripgrep" }

[[package]]
name = "eza"
backend = "pkg"
names = { pacman = "eza", apt = "eza", dnf = "eza", homebrew = "eza", zypper = "eza" }

[[package]]
name = "bat"
backend = "pkg"
names = { pacman = "bat", apt = "bat", dnf = "bat", homebrew = "bat", zypper = "bat" }


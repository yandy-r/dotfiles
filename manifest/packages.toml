# ================================================================
# dotf Provisioning Manifest
# ================================================================
# The manifest embedded into the dotf CLI binary via embed.go
# (//go:embed manifest/*.toml). It provisions the daily-driver toolset by
# default (base + dev) and the full legacy bootstrap.sh tool set through opt-in
# intents (runtimes, ai, cloud, git-tools) — see #31. It defines:
#   - [intents.<name>]   named, user-selectable bundles of packages
#   - [[package]]         installable units, one entry per supported backend
#   - [[symlink]]         dotfiles-to-$HOME mappings, ported from
#                          playbooks/vars/symlinks.yml
#
# Schema contract: internal/manifest/types.go (Manifest/Intent/Package/
# Symlink/Backend). Keep this file in sync with that package — it is the
# frozen source of truth for field names and the Backend values
# (pkg, github-release, aur, toolchain, repo, script-url,
# custom-script, git-clone, font).
#
# The `names` table on a [[package]] maps a platform.PkgMgr key
# (internal/platform/types.go) to the package name used by that manager.
# Only "pacman", "apt", "dnf", "homebrew", "yum", and "zypper" are valid
# keys — except for toolchain packages, which instead key the install
# identifier by tool ("cargo", "npm"), e.g. names = { cargo = "ripgrep" }
# when the crate name differs from the binary name.

# ================================================================
# INTENTS
# ================================================================
# Named bundles a user opts into during provisioning. `default = true`
# pre-selects the intent in the interactive TUI.

[intents.base]
description = "Minimal baseline tools for any machine"
default = true
packages = ["ripgrep", "starship"]

[intents.dev]
description = "Development toolchain, editors, and shell tooling"
default = false
packages = [
    "eza",
    "bat",
    "fd",
    "fzf",
    "delta",
    "zoxide",
    "jq",
    "gh",
    "lazygit",
    "tmux",
    # Herdr uses sibling entries for the existing one-token OS-gate pattern,
    # preventing native Windows applicability while sharing one logical binary.
    "herdr",
    "herdr-macos",
    "neovim",
    "yazi",
    "direnv",
    "lazygit-bin",
    "yazi-bin",
    "atuin",
    "docker-ce",
    # Shell/dev packages bootstrapped from native package managers. Entries that
    # lack an official openSUSE package stay linux+macos-gated (see below) so
    # the cross-platform reachability contract stays honest.
    "ruby",
    "ruby-devel",
    "zsh-autosuggestions",
    "zsh-autosuggestions-macos",
    "zsh-syntax-highlighting",
    "zsh-syntax-highlighting-macos",
    "black",
    "black-macos",
    "kate",
    "ruff",
    "ruff-macos",
]

[intents.fonts]
description = "Patched Nerd Font families the terminal and editor configs pin"
default = true
packages = ["jetbrains-mono-nerd-font"]

[intents.gaming]
description = "Gaming platforms and launchers"
default = false
packages = ["lutris", "lutris-pkg"]

[intents.desktop-fonts]
description = "Additional Nerd Font families used by the Hyprland desktop set"
default = false
packages = ["caskaydia-mono-nerd-font", "caskaydia-cove-nerd-font"]

# --- opt-in provisioning-parity bundles --------------------------------
# These wrap the battle-tested bin/install-*.sh scripts via the custom-script
# backend to reach parity with the legacy bootstrap.sh tool set (#31). They are
# opt-in: excluded from the headless default set (cmd/dotf/applyopts.go
# optInIntents) and selected explicitly with `--intent <name>`. The scripts
# self-detect the platform and self-skip when the tool is already installed.

[intents.runtimes]
description = "Language runtime managers and toolchains (mise, rust, lua)"
default = false
packages = ["mise", "rust", "lua"]

[intents.ai]
description = "AI coding assistants and CLIs"
default = false
packages = ["claude", "codex", "opencode", "fabric", "coderabbit"]

[intents.cloud]
description = "Cloud, IaC, and container CLIs"
default = false
packages = ["aws-tools", "azure-cli", "hashicorp-tools", "container-tools", "turso"]

[intents.git-tools]
description = "Git and forge tooling (tea, lefthook)"
default = false
packages = ["tea", "lefthook"]

[intents.system]
description = "System setup steps (tmux plugin manager, tmux-sessionizer, macOS GNU utils)"
default = false
packages = ["tpm", "tmux-sessionizer", "gnu-utilities", "debtap"]

# ================================================================
# PACKAGES
# ================================================================
# Every name referenced above in an intent's `packages` array MUST exist
# as a [[package]].name, and package names MUST be unique across the whole
# manifest. Commented-out reference examples document the backends the
# default set does not currently use.

# --- pkg: installed via the host's native package manager -------------
# The modern-CLI toolset the shared shell configuration (common/tools.sh,
# common/aliases.sh) depends on. The `names` table IS the applicability
# declaration: internal/backend/pkg.go's applicableFor makes an entry applicable
# exactly where it declares a name for the host's package manager, so a manager
# whose distro genuinely does not package the tool is OMITTED, never invented —
# the entry reports applicable=false there instead of aborting the run. Any tool
# omitted for some manager MUST be covered by a sibling entry on another backend
# (see lazygit-bin / yazi-bin below); that reachability contract is enforced by
# TestEmbeddedManifest_ToolsReachableOnSupportedManagers. apt's fdfind/batcat
# binary renames are irrelevant here because installs are detected via
# package-manager query, not a PATH probe.
[[package]]
name = "ripgrep"
backend = "pkg"
names = { pacman = "ripgrep", apt = "ripgrep", dnf = "ripgrep", homebrew = "ripgrep", zypper = "ripgrep" }

[[package]]
name = "eza"
backend = "pkg"
names = { pacman = "eza", apt = "eza", dnf = "eza", homebrew = "eza", zypper = "eza" }

[[package]]
name = "bat"
backend = "pkg"
names = { pacman = "bat", apt = "bat", dnf = "bat", homebrew = "bat", zypper = "bat" }

[[package]]
name = "fd"
backend = "pkg"
names = { pacman = "fd", apt = "fd-find", dnf = "fd-find", homebrew = "fd", zypper = "fd" }

[[package]]
name = "fzf"
backend = "pkg"
names = { pacman = "fzf", apt = "fzf", dnf = "fzf", homebrew = "fzf", zypper = "fzf" }

[[package]]
name = "delta"
backend = "pkg"
names = { pacman = "git-delta", apt = "git-delta", dnf = "git-delta", homebrew = "git-delta", zypper = "git-delta" }

[[package]]
name = "zoxide"
backend = "pkg"
names = { pacman = "zoxide", apt = "zoxide", dnf = "zoxide", homebrew = "zoxide", zypper = "zoxide" }

[[package]]
name = "jq"
backend = "pkg"

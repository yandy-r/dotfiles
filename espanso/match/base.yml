# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# General-purpose snippets, available in every application.

matches:
  - trigger: ':date'
    replace: '{{date}}'
    vars:
      - name: date
        type: date
        params:
          format: '%Y-%m-%d'

  - trigger: ':time'
    replace: '{{time}}'
    vars:
      - name: time
        type: date
        params:
          format: '%H:%M'

  - trigger: ':now'
    replace: '{{now}}'
    vars:
      - name: now
        type: date
        params:
          format: '%Y-%m-%dT%H:%M:%S%z'

  - trigger: ':shrug'
    replace: "¯\\_(ツ)_/¯"

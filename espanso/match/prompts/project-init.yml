# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :projinit - initialize a project, or bring an existing one up to standard
# (agent docs, git conventions, GitHub templates/labels, lint/format, CI,
# release model, release CI). Every step is idempotent: audit, then update.

matches:
  - trigger: ':projinit'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Release model [[model]]  Issue tracker [[tracker]]
          fields:
            model:
              type: choice
              values:
                - auto (let release-model decide)
                - trunk-only
                - release-branches
              default: auto (let release-model decide)
            tracker:
              type: choice
              values:
                - Linear
                - GitHub Issues
                - none
              default: Linear
    replace: |
      /goal Init this project end to end w/ my standard tooling (steps below).

      ## New or Existing (only add/update what's missing or stale)

      - Survey first: toolchain, package manager, agent docs (CLAUDE.md/AGENTS.md/.cursor/rules), .github/, lint/format, git hooks, RELEASING.md, release workflows, tags, branches
      - Prefer skills' update/sync/audit modes; never clobber customized files: merge gaps, show diff before overwriting
      - Keep existing language, framework, package manager, conventions; migrate a tool only if broken/unsupported

      ## Steps

      1. Post short plan from survey (exists/missing/per-step changes). No commits yet? Push one `git commit --allow-empty` to default branch as PR base. Then worktree/branch `chore/project-init` off it; all other commits go there
      2. Agent docs, git, GitHub templates: `/ycc:init --templates --git` (existing: `--update`) → agent docs, .gitmessage, commitlint, lefthook, issue forms, PR template, PR-title workflow, `.github/labels.md`
      3. Labels: `gh label create` each missing one in `.github/labels.md`
      4. Lint/format w/ CI + hooks: `/ycc:formatters --ci --hooks --yes` (existing: `--sync`). Run lint + format once; fix findings in separate commit
      5. Release model: no RELEASING.md? `/ycc:release-model` w/ model {{form.model}} ("auto": take recommendation); else `/ycc:release-model --audit`, `--upgrade` only on gaps
         - Tracker: {{form.tracker}}. Linear → release-label tracker so issues carry target release
         - release-branches → `backport:X.Y` label per maintenance branch
      6. Release CI: no release workflow? `/ycc:releaser --ci-config=generate --dry-run` (workflow only); else `/ycc:releaser --ci-config=audit`, fix findings
      7. Agent hooks (if language has rule-based hooks): `/ycc:hooks-workflow <language> --target=claude --dry-run`, apply what fits
      8. Hygiene, where missing: README (setup, test, lint, release cmds), LICENSE (ask me which), Dependabot/Renovate for project ecosystems
      9. Verify: lint, format check, type-check, build, tests; generated workflows valid YAML, reference real jobs/scripts
      10. Commit (Conventional Commits, grouped by concern), PR: `/ycc:git-workflow --pr --ci --ci-yes`
      11. Squash merge on green CI, clean up branch

      ## Never

      - Cut/tag/publish a release w/o my approval (release CI: generate/audit only)
      - Edit RELEASING.md by hand (only `/ycc:release-model`)
      - Delete/rename existing labels, workflows, branches (except yours), tags
      - Direct commit/push to default/release/long-lived branches (except step 1's empty commit)
      - Commit secrets; `.env*` stays out of git (encrypted dotenvx files excepted)

      ## Manual Follow-Ups

      List (don't do) what needs repo admin: branch protection/rulesets (required checks: lint, tests, PR title), secret scanning + push protection, Codex code review for repo, secrets release workflow needs.

      ## Done When

      - Every step created/updated/confirmed current; lint, tests, CI green; setup PR merged
      - Report per step: created/updated/current/skipped (+ why), plus manual follow-ups

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :projinit - initialize a project, or bring an existing one up to standard
# (agent docs, git conventions, GitHub templates/labels, lint/format, CI,
# release model, release CI). Every step is idempotent: audit, then update.

matches:
  - trigger: ':projinit'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Release model [[model]]  Issue tracker [[tracker]]
          fields:
            model:
              type: choice
              values:
                - auto (let release-model decide)
                - trunk-only
                - release-branches
              default: auto (let release-model decide)
            tracker:
              type: choice
              values:
                - Linear
                - GitHub Issues
                - none
              default: Linear
    replace: |
      /goal Initialize this project end-to-end with my standard tooling: agent docs, git conventions, GitHub templates and labels, lint/format, CI, a release model, and release CI.

      ## New or Existing

      The project may already be partly or fully set up. Detect that first; only add or update what is missing or stale:

      - Survey before changing anything: toolchain, package manager, CLAUDE.md/AGENTS.md/.cursor/rules, .github/ (workflows, issue forms, PR template, labels), lint/format configs, git hooks, RELEASING.md, release workflows, tags, branches
      - Prefer each skill's update/sync/audit mode; never clobber customized files (issue forms, PR template, .gitignore, workflows, commitlint). Merge in what's missing; show me the diff before overwriting
      - Keep the existing language, framework, package manager, and conventions; migrate a tool only if it's broken or unsupported
      - If a step is already current, say so and skip it

      ## Steps

      1. Survey, then post a short plan: what exists, what's missing, what each step will create or update
      2. Agent docs, git conventions, GitHub templates: `/ycc:init --templates --git` (existing: add `--update`). Yields CLAUDE.md, AGENTS.md, .cursor/rules, .gitignore, .gitmessage, Conventional Commits (commitlint where applicable), lefthook, issue forms, PR template, PR-title workflow, `.github/labels.md`
      3. Labels: `gh label create` each label in `.github/labels.md` that's missing; never delete or rename labels
      4. Lint/format with CI and hooks: `/ycc:formatters --ci --hooks --yes` (existing: add `--sync`). Then run lint and format once and fix findings in a separate commit
      5. Release model: no RELEASING.md, run `/ycc:release-model` with model {{form.model}} ("auto": accept its recommendation); otherwise `/ycc:release-model --audit`, then `--upgrade` only if it finds gaps
         - Tracker: {{form.tracker}}. With Linear, use the release-label tracker so issues carry a target release
         - Under release-branches, create a `backport:X.Y` label per maintenance branch
      6. Release CI: no release workflow, `/ycc:releaser --ci-config=generate --dry-run` (workflow only, no release); otherwise `/ycc:releaser --ci-config=audit` and fix what it reports
      7. Agent hooks, if the language has rule-based hooks: `/ycc:hooks-workflow <language> --target=claude --dry-run`, then apply what fits
      8. Hygiene, where missing: README (setup, test, lint, release commands), LICENSE (ask me which), Dependabot or Renovate for the project's ecosystems
      9. Verify: lint, format check, type-check, build, tests; generated workflows are valid YAML and reference real jobs and scripts
      10. Commit (Conventional Commits, grouped by concern) and open a PR with `/ycc:git-workflow --pr --ci --ci-yes`. Brand-new repo with no commits or remote: commit to the default branch
      11. Squash merge on green CI, then clean up the branch

      ## Must Not Do

      - Never cut, tag, or publish a release; release CI is generated or audited only
      - Never edit RELEASING.md by hand, only via `/ycc:release-model`
      - Never delete or rename existing labels, workflows, branches, or tags
      - Never commit secrets; keep `.env*` out of git (encrypted dotenvx files excepted)

      ## Manual Follow-Ups

      List what needs repo admin instead of doing it: branch protection/rulesets (required checks: lint, tests, PR title), secret scanning and push protection, the CodeRabbit app, and secrets the release workflow needs.

      ## Done When

      - Every step is created, updated, or confirmed current; lint, tests, and CI are green; the setup PR is merged
      - Final report: per step, created / updated / current / skipped (and why), plus the manual follow-ups

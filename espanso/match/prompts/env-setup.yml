# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :envsetup - set up and verify a Cursor cloud agent development environment.
# Static text (no form); deliberately not a /goal prompt.

matches:
  - trigger: ':envsetup'
    replace: |
      /env-setup Set up this codebase's dev environment, run its apps to prove it works, and report every secret I must add before saving.

      ## Discover

      - Read repo rules + docs first (AGENTS.md, CLAUDE.md, README, CONTRIBUTING, docs/), then package scripts, lockfiles, version pins (.nvmrc, .tool-versions, go.mod, pyproject.toml, rust-toolchain), Docker/compose, CI workflows
      - Follow repo conventions; CI shows canonical install, lint, test, build commands

      ## Set Up

      - Install pinned runtimes, tools, deps from lockfiles (frozen installs); don't upgrade/rewrite lockfiles
      - Separate persistent setup (install/start scripts for the cloud env config, per repo convention) from app runtime (dev servers, workers, DBs started only to run apps)
      - Start required services + apps in safe local mode (local DB, emulator, mock, seeded fixture); keep each running where I can reach it

      ## Verify

      - Run available lint, test, build commands
      - Prove apps work: real smoke request to a running app or open it in a browser; capture what you saw
      - Report each command, URL, result, plus anything unverified + why

      ## Secrets

      - List every required/optional secret as env var NAME only, w/ purpose + source (e.g. .env.example, config code, CI)
      - Never print, guess, or commit secret values; never read real production services or secret stores; use placeholders/local fakes
      - Required secret missing? Setup not complete: stop, ask me to add it to cloud env secrets before final live checks + saving

      ## Boundaries

      - No commits to default branch, deploys, pushes, or PRs; leave only setup changes the repo needs
      - Final short report: setup commands, run commands + URLs, verification results, required/optional secret names, open limitations

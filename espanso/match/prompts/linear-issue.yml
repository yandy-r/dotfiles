# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :linissue - file a detailed, agent-ready Linear issue for later work (no code changes).

matches:
  - trigger: ':linissue'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Team (itcn workspace) [[team]]
            What to track [[topic]]
          fields:
            team:
              type: choice
              values:
                - yandy-r
                - itcn
              default: yandy-r
            topic:
              multiline: true
    replace: |
      /goal Create one detailed, agent-ready Linear issue in the {{form.team}} team (itcn workspace) tracking the topic below for later implementation.

      ## Topic

      {{form.topic}}

      ## Guardrails

      - Before any write: confirm workspace itcn + team {{form.team}}; mismatch or Linear unavailable? stop
      - No code changes, commits, branches; working tree untouched
      - Read repo only to ground the issue; unrelated to topic? say so
      - Topic too vague to ground? ask first
      - No secrets, tokens, `.env` values in the issue

      ## Duplicates

      - Search open, completed, archived issues + projects
      - Likely duplicate? Change nothing; report its ID, ask how to proceed

      ## Project

      - Use best-fit existing project
      - None fits? Study current projects (team, naming, description, lead, status, milestones), create one matching them; team/fit ambiguous? ask
      - Create ≤1 project; never modify/archive others
      - Existing labels only; set priority/estimate only if team uses them and evidence supports a value
      - No assignee; default status

      ## Issue Body

      Implementable by an agent w/ no prior context:

      - **Summary**: problem/goal + why it matters
      - **Context**: current behavior, relevant files/symbols/paths, related issues, docs, links
      - **Requirements**: numbered, testable
      - **Out of scope**: what not to touch
      - **Approach**: suggested plan, key decisions, alternatives
      - **Risks**: edge cases, migrations, security, compatibility
      - **Acceptance criteria**: checklist of observable outcomes
      - **Verification**: commands from repo (package.json, Makefile, CI) + expected results; never guess
      - **Agent notes**: suggested skills/agents, conventions, open questions

      Real paths/symbols only; mark guesses as assumptions.

      ## Done When

      - Issue exists in correct project, clear title, only supported metadata
      - Report: issue ID/URL, team, project (+ created?), metadata left unset, open questions

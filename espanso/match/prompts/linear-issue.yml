# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :linissue - file a detailed, agent-ready Linear issue for later work (no code changes).

matches:
  - trigger: ':linissue'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Team (itcn workspace) [[team]]
            What to track [[topic]]
          fields:
            team:
              type: choice
              values:
                - yandy-r
                - itcn
              default: yandy-r
            topic:
              multiline: true
    replace: |
      /goal Create one detailed, agent-ready Linear issue in the {{form.team}} team of the itcn workspace to track the topic below for later implementation.

      ## Topic

      {{form.topic}}

      ## Guardrails

      - Before any write, confirm the connected Linear workspace is itcn and the team is {{form.team}}; if not, or Linear is unavailable, stop
      - No code changes, commits, or branches; leave the working tree untouched
      - Read the current repo only to ground the issue; if it is unrelated to the topic, say so
      - Ask first if the topic is too vague to ground
      - Never put secrets, tokens, or `.env` values in the issue

      ## Duplicates

      - Search open, completed, and archived issues and projects
      - If a likely duplicate exists, change nothing; report its ID and ask how to proceed

      ## Project

      - Use the best-fit existing project
      - If none fits, study current projects (team, naming, description, lead, status, milestones) and create one that matches them; if team or fit is ambiguous, ask
      - Create at most one project; never modify or archive others
      - Use existing labels; only set priority or estimate when the team uses them and evidence supports a value
      - Don't assign anyone; leave the default status

      ## Issue Body

      Write it so an agent with no prior context can implement it:

      - **Summary**: problem or goal and why it matters
      - **Context**: current behavior, relevant files/symbols/paths, related issues, docs, links
      - **Requirements**: numbered and testable
      - **Out of scope**: what not to touch
      - **Approach**: suggested plan, key decisions, alternatives
      - **Risks**: edge cases, migrations, security, compatibility
      - **Acceptance criteria**: checklist of observable outcomes
      - **Verification**: commands from the repo (package.json, Makefile, CI) and expected results; never guess
      - **Agent notes**: suggested skills/agents, conventions, open questions

      Cite real paths and symbols only; mark guesses as assumptions.

      ## Done When

      - The issue exists in the correct project with a clear title and only supported metadata
      - Report the issue ID/URL, team, project and whether it was created, metadata left unset, and open questions

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :release - cut the next release end-to-end, with publish approval.

matches:
  - trigger: ':release'
    vars:
      - name: form
        type: form
        params:
          layout: 'Release level [[level]]'
          fields:
            level:
              type: choice
              values:
                - patch
                - minor
                - major
              default: patch
    replace: |
      /goal Cut the next {{form.level}} release end to end. You have approval to confirm and publish.

      ## Before

      - Read RELEASING.md first: it sets the source branch for a {{form.level}} release, the version, and any follow-up branches created
      - release-branches model? `/ycc:backport --audit` for the line so every labelled fix has a merged backport
      - CI green on the release branch
      - Note open PRs/Linear issues still targeting this release for the report; don't hold for them unless RELEASING.md requires

      ## Release

      - Land needed commits (version, changelog, docs) via branch + PR into release branch, merge on green CI; never commit/push directly to default/release/long-lived branches
      - Bots (CodeRabbit/Codex/Claude/Greptile/...): 2 fix rounds max, then only high/P1+; reply to rest
      - Then `/ycc:releaser <version> --publish --confirm --ci --ci-yes`
      - Notes from merged changes; call out breaking changes w/ migration steps (required for major)
      - Only direct ref writes: the release tag + branches RELEASING.md says the release creates
      - Never move/delete/recreate an existing tag, force-push, or hand-edit RELEASING.md (only release tooling or `/ycc:release-model`)

      ## Done When

      - Release published, its CI green, every expected artifact + checksum attached
      - Report: version, tag, release URL, follow-up branches created, anything left open

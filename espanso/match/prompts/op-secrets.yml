# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :opsecrets - back up a project's secrets into 1Password secure notes.

matches:
  - trigger: ':opsecrets'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Note name [[note]]
            Vault [[vault]]  Reference note [[reference]]
          fields:
            note:
              default: PRAXRR_SECRETS
            vault:
              default: EnvSecrets
            reference:
              default: TOKENHOP_SECRETS
    replace: |
      /goal Back up this project's secrets to 1Password. I may move to a 1Password service account later; for now this is a backup.

      ## What to Create

      - A **{{form.note}}** secure note in the **{{form.vault}}** vault, with one concealed field per key, labeled with the key name
      - Match the structure of **{{form.reference}}**, which already exists
      - If there are multiple environments or secret files, create one note per environment (e.g. `{{form.note}}_PRODUCTION`), unless {{form.reference}} uses a section per environment; then follow it

      Example field (illustration only):

      ```
      CLOUDFLARE_API_TOKEN
      <token>
      ```

      ## How

      - Find the secrets in the project's env sources (e.g. dotenvx-encrypted `.env*` files) and decrypt them with dotenvx in memory
      - If the op CLI is not signed in, refresh the shell
      - Never print secret values to the terminal, logs, or this conversation
      - Never pass values as command-line arguments (they show up in `ps` and shell history); build the item as an `op item create --template` JSON in a private temp file (mode 600) and delete it afterwards
      - Don't modify, re-encrypt, or commit the project's env files

      ## Done When

      - Each note's field labels (not values) match the source keys
      - You finish with a short report: notes created, key count per note, and any keys skipped and why

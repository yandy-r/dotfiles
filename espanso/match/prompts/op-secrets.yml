# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :opsecrets - back up a project's secrets into 1Password secure notes.

matches:
  - trigger: ':opsecrets'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Note name [[note]]
            Vault [[vault]]  Reference note [[reference]]
          fields:
            note:
              default: PRAXRR_SECRETS
            vault:
              default: EnvSecrets
            reference:
              default: TOKENHOP_SECRETS
    replace: |
      /goal Back up this project's secrets to 1Password (backup for now; may move to a service account later).

      ## Create

      - **{{form.note}}** secure note in **{{form.vault}}** vault: one concealed field per key, labeled w/ key name
      - Match structure of existing **{{form.reference}}**
      - Multiple environments/secret files? One note per environment (e.g. `{{form.note}}_PRODUCTION`), unless {{form.reference}} uses a section per environment; then follow it

      Example field (illustration only):

      ```
      CLOUDFLARE_API_TOKEN
      <token>
      ```

      ## How

      - Find secrets in project env sources (e.g. dotenvx-encrypted `.env*`); decrypt w/ dotenvx in memory
      - op CLI not signed in? Refresh the shell
      - Never print secret values (terminal, logs, this conversation)
      - Never pass values as CLI args (visible in `ps`/history); build item as `op item create --template` JSON in private temp file (mode 600), delete after
      - Don't modify, re-encrypt, or commit project env files

      ## Done When

      - Each note's field labels (not values) match source keys
      - Report: notes created, key count per note, keys skipped + why

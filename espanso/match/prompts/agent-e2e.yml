# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
# :e2e - end-to-end agent workflow (Linear issue -> RELEASING.md -> PR -> merge
# -> backport -> close). The text is rendered by scripts/agent-prompt.
#
# Profile: "auto" works in any repo (the agent finds the Linear workspace,
# team, and projects itself); a named profile pins them from
# scripts/profiles/<name>.conf. Keep these choices in sync with that directory
# (`npm run test:espanso` checks it).
#
# Target (optional) overrides the profile: issue IDs ("YAN-723, YAN-724") work
# exactly those issues; anything else is a Linear project to pick from.

matches:
  - trigger: ':e2e'
    replace: '{{prompt}}'
    vars:
      - name: form
        type: form
        params:
          layout: |
            Profile [[profile]]  Task [[task]]  Skill hints [[skills]]
            Target (optional: issue IDs or a Linear project) [[target]]
          fields:
            profile:
              type: choice
              values:
                - auto
                - tokenhop
                - praxrr
                - crosshook
                - opencode-goal-plugin
                - claude-plugins
                - itcn-crm
                - itcn-website
              default: auto
            task:
              type: choice
              values:
                - bugs
                - features
                - any
              default: bugs
            skills:
              type: choice
              values:
                - 'yes'
                - 'no'
              default: 'yes'
            target:
              default: ''
      # Form values reach the script as ESPANSO_FORM_* environment variables,
      # never interpolated into the command line.
      - name: prompt
        type: shell
        depends_on: [form]
        params:
          cmd: '"$CONFIG/scripts/agent-prompt"'

# Set default shell - use $SHELL variable for Homebrew zsh
set-option -g default-shell $SHELL
# Use default-command to start non-login shells (avoids path_helper issues)
set-option -g default-command $SHELL

# Update environment variables that should be inherited from parent shell
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY PATH"


# TERM colors
set -g default-terminal "tmux-256color"

# Enable true color (24-bit RGB) support for modern terminals
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",tmux*:Tc"

# Prefix key: C-b (default)
# NOTE: C-a is reserved for Ghostty's tmux-compatible key sequences.
# Keep tmux on C-b to avoid conflicts when running tmux inside Ghostty.
set-option -g prefix C-b
bind-key C-b send-prefix

# send command to all sessions
bind E command-prompt -p "Command:" \
       "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# send command to all windows/panes current session
bind W command-prompt -p "Command:" \
       "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# go to specific window number
bind g command-prompt -p "Go to window:"  "run \"tmux select-window -t ':%%'\""

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# kill session / window / panel
bind x kill-pane
bind X kill-window
# bind q confirm-before kill-session
bind Q confirm-before kill-session

# quality of life crap
set -g history-limit 199000
set-window-option -g mode-keys vi # default is emacs.. ewww
bind b send-prefix                # Ctrl^b+b send literal C-b

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# use vim-like keys for splits and windows
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-l) || tmux select-pane -R"
bind -n 'C-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'C-\\') || tmux select-pane -l"
bind C-l send-keys 'C-l'

bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

bind-key space next-window
bind-key bspace previous-window
bind-key n next-window
bind-key p previous-window
bind-key enter next-layout

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

# Syncronize panes
unbind /
# b for broadcast
bind-key b setw synchronize-panes

bind-key o last-pane
bind-key q display-panes
bind-key c new-window

bind-key [ copy-mode
bind-key ] paste-buffer

set-window-option -g display-panes-time 1500

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# allow renumber of windows
set-option -g renumber-windows on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
#unbind -n M-Left
#unbind -n M-Right
#unbind -n M-Up
#unbind -n M-Down

# Use Alt-vim keys without prefix key to switch panes
#bind -n M-h select-pane -L
#bind -n M-j select-pane -D
#bind -n M-k select-pane -U
#bind -n M-l select-pane -R

# mouse behavior
set -g mouse on
setw -g mouse on

# Don't let programs rename windows (e.g. escape sequences)
# automatic-rename (below) uses pane_current_path instead
set-option -g allow-rename off
set-option -g automatic-rename off

# COPY TO CLIPBOARD
# Enable OSC 52 clipboard support (allows clipboard over SSH)
set -g set-clipboard on
set -g allow-passthrough on

bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# macOS-specific clipboard bindings
if-shell '[ "$(uname)" = "Darwin" ]' {
  set-option -g default-command 'reattach-to-user-namespace -l $SHELL';
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy';
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy';
}

# Linux-specific clipboard bindings using OSC 52 for SSH compatibility
if-shell '[ "$(uname)" = "Linux" ]' {
  # Use OSC 52 for copy operations (works over SSH)
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux-osc52-copy';
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'tmux-osc52-copy';
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'tmux-osc52-copy';
}

# WINDOW SWAPPING
# swap current to top
bind-key T swap-window -t 0

# swap left and right respectively
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# PLUGINS
# List of plugins
# TPM (tmux plugin manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

#set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-yank plugin with OSC 52 support
set -g @plugin 'tmux-plugins/tmux-yank'
# Configure tmux-yank to use OSC 52 for SSH sessions
set -g @yank_selection 'clipboard'  # Use system clipboard
set -g @yank_selection_mouse 'clipboard'  # Mouse selections also go to clipboard
set -g @yank_with_mouse on  # Enable mouse support
# On Linux, prefer OSC 52 over xclip/xsel for SSH compatibility
if-shell '[ "$(uname)" = "Linux" ]' {
  set -g @override_copy_command 'tmux-osc52-copy';
}

# RESURRECT / CONTINUUM
# Explicit save directory (consistent across platforms)
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
# Save pane contents for full restoration
set -g @resurrect-capture-pane-contents 'on'
# for vim
set -g @resurrect-strategy-vim 'session'
# Save every 5 minutes (default 15 is too long — risks stale saves)
set -g @continuum-save-interval '5'
# Auto-restore on tmux server start
set -g @continuum-restore 'on'
# Boot-time start handled by systemd on Linux, launchctl on macOS
if-shell '[ "$(uname)" = "Darwin" ]' {
  set -g @continuum-boot 'on';
}

set -g @plugin 'tmux-plugins/tmux-open'

set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-thumbs is managed by TPM below — no manual run-shell needed
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux#v2.1.1' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

# Simplify window names - show only directory basename and window index
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_default_text "#I:#W"
set -g @catppuccin_window_current_text "#I:#W"
set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_current_fill "all"

# Window names set explicitly via resurrect; automatic-rename disabled
# to prevent overwriting restored session/window names
# set-option -g automatic-rename-format '#{b:pane_current_path}'
set -g @plugin 'omerxx/tmux-sessionx'
# I recommend using `o` if not already in use, for least key strokes when launching
set -g @sessionx-bind 'o'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 't'

# COLORS
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/block/blue'
# set -g @themepack 'powerline/block/cyan'
# set -g @themepack 'powerline/default/gray'
# set -g @themepack 'powerline/double/cyan'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

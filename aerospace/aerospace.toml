# ================================================================
# AeroSpace Configuration
# ================================================================
# Enhanced configuration for AeroSpace tiling window manager
# Place a copy of this config to ~/.aerospace.toml
# Documentation: https://nikitabobko.github.io/AeroSpace/
# Documentation: https://github.com/NikitaBobko/AeroSpace/wiki

# ================================================================
# STARTUP CONFIGURATION
# ================================================================

# Note: after-login-command is deprecated since AeroSpace 0.19.0
# Use after-startup-command instead for initialization commands

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  # Set initial workspace
  'workspace 1',
  # Initialize borders for visual feedback
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

# Start AeroSpace at login
start-at-login = true

# ================================================================
# CORE BEHAVIOR SETTINGS
# ================================================================

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# You can effectively turn off macOS 'Hide application' (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# ================================================================
# KEYBOARD & VISUAL SETTINGS
# ================================================================

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor.'some-pattern' = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 20
inner.vertical = 20
outer.left = 20
outer.bottom = 20
outer.top = 20
outer.right = 20

# ================================================================
# KEY BINDINGS - MAIN MODE
# ================================================================
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift
# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# ----------------------------------------------------------------
# Application Launchers
# ----------------------------------------------------------------
# Terminal launcher - disabled to allow opt+enter in terminal apps (e.g., Claude Code newlines)
# alt-enter = 'exec-and-forget open -n -a Ghostty'

# Alternative terminal options:
# alt-enter = 'exec-and-forget open -n -a iTerm'
# alt-enter = 'exec-and-forget open -n -a WezTerm'
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# Quick app launcher
alt-space = 'exec-and-forget ~/.config/dotfiles/scripts/aerospace-launcher.sh'

# ----------------------------------------------------------------
# Layout Management
# ----------------------------------------------------------------
# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-period = 'layout floating tiling'              # Toggle floating
alt-shift-period = 'layout tiles accordion'        # Toggle between tiles and accordion

# ----------------------------------------------------------------
# Window Focus (Vim-style navigation)
# ----------------------------------------------------------------
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Monitor focus
alt-shift-left = 'focus-monitor left'
alt-shift-right = 'focus-monitor right'
alt-shift-up = 'focus-monitor up'
alt-shift-down = 'focus-monitor down'

# ----------------------------------------------------------------
# Window Movement
# ----------------------------------------------------------------
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Move window to monitor
alt-cmd-left = 'move-node-to-monitor left'
alt-cmd-right = 'move-node-to-monitor right'
alt-cmd-up = 'move-node-to-monitor up'
alt-cmd-down = 'move-node-to-monitor down'

# ----------------------------------------------------------------
# Window Resizing
# ----------------------------------------------------------------
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Precise resizing
alt-cmd-h = 'resize width -50'
alt-cmd-j = 'resize height +50'
alt-cmd-k = 'resize height -50'
alt-cmd-l = 'resize width +50'

# Quick resize presets
alt-cmd-1 = 'resize smart 33' # 33% width
alt-cmd-2 = 'resize smart 50' # 50% width
alt-cmd-3 = 'resize smart 66' # 66% width

# ----------------------------------------------------------------
# Workspace Navigation
# ----------------------------------------------------------------
# Number workspaces (1-9)
alt-1 = 'workspace 1' # General
alt-2 = 'workspace 2' # Development
alt-3 = 'workspace 3' # Development
alt-4 = 'workspace 4' # Development
alt-5 = 'workspace 5' # Development
alt-6 = 'workspace 6' # Development
alt-7 = 'workspace 7' # Development
alt-8 = 'workspace 8' # Development
alt-9 = 'workspace 9' # Meetings

# Letter workspaces (organized by category)
alt-a = 'workspace A' # AI Workspace
alt-b = 'workspace B' # Browser Workspace
alt-c = 'workspace C' # Communication Workspace
alt-d = 'workspace D' # Design/Documents
alt-e = 'workspace E' # Entertainment Workspace
# alt-f = 'workspace F' # Reserved for fullscreen toggle
alt-g = 'workspace G' # God/Religion
alt-i = 'workspace I' # Images/Media
alt-m = 'workspace M' # Microsoft Workspace
alt-n = 'workspace N' # Notes Workspace
alt-o = 'workspace O' # Operations
alt-p = 'workspace P' # Personal Workspace
alt-q = 'workspace Q' # Quick/Temp
alt-r = 'workspace R' # Research
alt-s = 'workspace S' # Study Workspace
alt-t = 'workspace T' # Terminal Workspace
alt-u = 'workspace U' # Utilities
alt-v = 'workspace V' # Virtualization Workspace (Parallels)
alt-w = 'workspace W' # Work Workspace
alt-x = 'workspace X' # Transmit and Debugging Workspace
alt-y = 'workspace Y' # Extra
alt-z = 'workspace Z' # Remote/Citrix

# Workspace navigation shortcuts
alt-leftSquareBracket = 'workspace --wrap-around prev'  # Previous workspace
alt-rightSquareBracket = 'workspace --wrap-around next' # Next workspace

# ----------------------------------------------------------------
# Move Window to Workspace
# ----------------------------------------------------------------
# Move to number workspaces
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Move to letter workspaces
alt-shift-a = 'move-node-to-workspace A'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-e = 'move-node-to-workspace E'
# alt-shift-f = 'fullscreen' # Reserved for fullscreen
alt-shift-g = 'move-node-to-workspace G'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-q = 'move-node-to-workspace Q'
alt-shift-r = 'move-node-to-workspace R'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-u = 'move-node-to-workspace U'
alt-shift-v = 'move-node-to-workspace V'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-x = 'move-node-to-workspace X'
alt-shift-y = 'move-node-to-workspace Y'
alt-shift-z = 'move-node-to-workspace Z'

# Move window to prev/next workspace
alt-shift-leftSquareBracket = 'move-node-to-workspace --wrap-around prev'
alt-shift-rightSquareBracket = 'move-node-to-workspace --wrap-around next'

# ----------------------------------------------------------------
# Window & System Actions
# ----------------------------------------------------------------
# Fullscreen toggle
alt-shift-f = 'fullscreen'

# Center window (for floating windows)
alt-ctrl-c = 'exec-and-forget ~/.config/dotfiles/scripts/aerospace-center-window.sh'

# Workspace and monitor management
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Balance layout - distribute space evenly
alt-ctrl-b = 'balance-sizes'

# ----------------------------------------------------------------
# Service Mode Entry
# ----------------------------------------------------------------
alt-shift-semicolon = 'mode service'

# ----------------------------------------------------------------
# System Integration
# ----------------------------------------------------------------
# Reload configuration
alt-ctrl-r = 'reload-config'

# Emergency reset (flatten workspace)
alt-shift-backspace = 'flatten-workspace-tree'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ================================================================
# ENVIRONMENT VARIABLES
# ================================================================
[exec.env-vars]
PATH = '${PATH}'

# ================================================================
# WINDOW RULES
# ================================================================
# Custom window detection and placement rules
# See: https://nikitabobko.github.io/AeroSpace/guide#window-rules


$lock_background = rgba(1f2430f2)
$lock_surface = rgba(353c4af2)
$lock_surface_alt = rgba(1f2430d9)
$lock_text = rgb(d8dee9)
$lock_accent = rgb(7dcfff)
$lock_success = rgb(a6da95)
$lock_danger = rgb(f7768e)

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $lock_background
    blur_passes = 0
}

animations {
    enabled = false
}

shape {
  monitor =
  size = 520, 320
  position = 0, 0
  halign = center
  valign = center
  color = $lock_surface_alt
  rounding = 20
  border_size = 2
  border_color = $lock_accent
}

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $lock_text
  font_size = 64
  position = 0, 70
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] date +"%A, %B %d"
  color = $lock_text
  font_size = 20
  position = 0, 20
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:500] awk '{print ($0?"Caps Lock":""); exit}' /sys/class/leds/input*::capslock/brightness
  color = $lock_accent
  font_size = 16
  position = 0, -18
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 300, 56
    position = 0, -78
    halign = center
    valign = center

    inner_color = $lock_surface
    outer_color = $lock_accent
    outline_thickness = 2

    font_family = CaskaydiaMono Nerd Font
    font_color = $lock_text

    placeholder_text = Enter password
    check_color = $lock_success
    fail_color = $lock_danger
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 12
    shadow_passes = 0
    fade_on_empty = false
}

label {
  monitor =
  text = $FPRINTPROMPT
  color = $lock_accent
  font_size = 14
  position = 0, -120
  halign = center
  valign = center
}

auth {
    fingerprint {
        enabled = false
        ready_message = Use fingerprint or enter password
        present_message = Scanning...
        retry_delay = 250
    }
}

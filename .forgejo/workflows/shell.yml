name: Shell

# Forgejo-native shell CI. Forgejo reads workflows from .forgejo/workflows/ in
# preference to .github/workflows/ (the two directories are never merged), so
# this mirrors .github/workflows/shell.yml for the self-hosted origin. The
# shellcheck job does not diverge: shellcheck is installed from its pinned
# upstream tarball, which needs no third-party action and so is unaffected by
# Forgejo's DEFAULT_ACTIONS_URL constraint. The regression job diverges in one
# way: Forgejo has no macOS runners, so it runs on ubuntu-latest only (no OS
# matrix, no bash 3.2 step), and installs zsh and git without assuming sudo.
# Keep this in sync with .github/workflows/shell.yml.

# Shell axis, two jobs:
#   - shellcheck: runs shellcheck through the repo's single style dispatcher
#     (bin/lint.sh --shell -> `shellcheck --severity=warning` over every tracked
#     *.sh), so CI and `npm run lint` cannot drift apart. Fedora's provisioning
#     correctness lives as much in common/ and bin/ as it does in Go, and
#     neither was gated by any workflow before.
#   - regression: runs the hermetic shell regression scripts (scripts/test-*.sh
#     for the local-overrides hook, shell parity, the bash prompt, the startup
#     cache, the platform predicates and the startup smoke driver) plus the
#     bats-core suite in tests/shell, on Linux, with zsh installed so the zsh
#     cases run too, plus the hermetic tool/installer tests
#     (cursor-export-secrets, install-*, targeted-research, tea-tools). The GitHub
#     twin also covers macOS (Homebrew bash 5 and
#     the system /bin/bash 3.2), which this job cannot.

on:
  pull_request:
    paths:
      - '**.sh'
      - 'common/**'
      - 'bin/**'
      - 'bash/**'
      - 'zsh/**'
      - 'shellcheck/**'
      - 'tests/**'
      - '.forgejo/workflows/shell.yml'
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - 'common/**'
      - 'bin/**'
      - 'bash/**'
      - 'zsh/**'
      - 'shellcheck/**'
      - 'tests/**'
      - '.forgejo/workflows/shell.yml'

permissions:
  contents: read

env:
  # Pinned to the version the tree is verified clean against at
  # --severity=warning. Bumping it is a deliberate change that may surface new
  # findings across common/ and bin/, so it does not ride along with unrelated
  # work.
  SHELLCHECK_VERSION: v0.9.0

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install shellcheck
        # Installed from the pinned upstream tarball rather than the runner's
        # preinstalled copy or a third-party action, so both CI systems run the
        # identical binary. Installed under $HOME so no sudo is required.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the repo's shellcheck policy
        # shellcheck reads its rc from $HOME/.shellcheckrc, and on a provisioned
        # machine `dotf link` puts the repo's own shellcheck/shellcheckrc there
        # (internal/symlink/table.go). A CI runner has no such symlink, so
        # without this step CI would enforce a stricter policy than the repo
        # declares and than any developer sees locally. Copying the tracked file
        # keeps a single source of truth for the disabled checks.
        run: install -m 0644 shellcheck/shellcheckrc "$HOME/.shellcheckrc"

      - name: Shellcheck
        run: |
          shellcheck --version
          bin/lint.sh --shell

  regression:
    # Linux only: Forgejo has no macOS runners. GitHub's twin also covers
    # macOS (Homebrew bash 5 and the system /bin/bash 3.2).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install zsh, git, jq and sqlite3
        # The Forgejo runner image may run as root without sudo, and may lack
        # zsh or git. Disabling man-db's trigger keeps the install fast.
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO rm -f /var/lib/man-db/auto-update
          $SUDO apt-get update -q && $SUDO apt-get install -y -q --no-install-recommends zsh git jq sqlite3

      - name: Shell versions
        run: |
          bash --version | head -n 1
          zsh --version

      - name: Install bats
        # Same pinned upstream install as the GitHub twin: release-tag clone
        # under /tmp, install.sh into $HOME/.local (no sudo, no action).
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Local overrides hook
        run: bash scripts/test-shell-local-hook.sh

      - name: Shell parity
        run: bash scripts/test-shell-parity.sh

      - name: Bash prompt
        run: bash scripts/test-bash-prompt.sh

      - name: Shell startup cache
        run: bash scripts/test-shell-startup-cache.sh

      - name: Platform predicates
        run: bash scripts/test-platform-predicates.sh

      - name: Shell startup smoke
        run: bash scripts/test-shell-startup-smoke.sh

      # Hermetic tool/installer tests (mirrors the GitHub twin's Linux steps).

      - name: Cursor secrets export
        run: bash scripts/test-cursor-export-secrets.sh

      - name: Codex installer lifecycle
        run: bash scripts/test-install-codex.sh

      - name: oh-my-pi installer lifecycle
        run: bash scripts/test-install-omp.sh

      - name: OpenCode installer lifecycle
        run: bash scripts/test-install-opencode.sh

      - name: Playwright CLI installer
        run: bash scripts/test-install-playwright-cli.sh

      - name: Targeted-research call surface
        run: bash scripts/test-targeted-research-call-surface.sh

      - name: tea-tools
        run: bash scripts/test-tea-tools.sh

      - name: Bats suite
        run: bats tests/shell

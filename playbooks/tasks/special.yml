---
# Special symlinks (ssh, ansible, direnv, branchlet, atuin, lazygit)

- name: Check special source files exist
  ansible.builtin.stat:
    path: '{{ dotfiles_dir }}/{{ item.src }}'
  register: special_src_check
  loop: '{{ special_symlinks }}'
  loop_control:
    label: '{{ item.src }}'

- name: Create special symlinks
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/{{ item.item.src }}'
    dest: '{{ home_dir }}/{{ item.item.dest }}'
    state: link
    force: '{{ force_symlinks }}'
  when:
    - not dry_run
    - item.stat.exists
  loop: '{{ special_src_check.results }}'
  loop_control:
    label: '{{ item.item.dest }}'

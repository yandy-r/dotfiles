---
# macOS-specific configurations

- name: Check macOS source files exist
  ansible.builtin.stat:
    path: '{{ dotfiles_dir }}/{{ item.src }}'
  register: macos_src_check
  loop: '{{ macos_configs }}'
  when: ansible_facts["os_family"] == "Darwin"
  loop_control:
    label: '{{ item.src }}'

- name: Create symlinks for macOS configs
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/{{ item.item.src }}'
    dest: '{{ home_dir }}/{{ item.item.dest }}'
    state: link
    force: '{{ force_symlinks }}'
  when:
    - not dry_run
    - ansible_facts["os_family"] == "Darwin"
    - item.stat.exists
  loop: '{{ macos_src_check.results | default([]) }}'
  loop_control:
    label: '{{ item.item.dest }}'

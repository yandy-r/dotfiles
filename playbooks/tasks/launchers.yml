---
# Desktop application launchers (.desktop files)

- name: Check launcher source files exist
  ansible.builtin.stat:
    path: '{{ dotfiles_dir }}/{{ item.src }}'
  register: launcher_src_check
  loop: '{{ launcher_configs }}'
  when:
    - is_linux_family
    - manage_linux_desktop
  loop_control:
    label: '{{ item.src }}'

- name: Create symlinks for desktop launchers
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/{{ item.item.src }}'
    dest: '{{ home_dir }}/{{ item.item.dest }}'
    state: link
    force: '{{ force_symlinks }}'
  when:
    - not dry_run
    - is_linux_family
    - manage_linux_desktop
    - item.stat.exists
  loop: '{{ launcher_src_check.results | default([]) }}'
  loop_control:
    label: '{{ item.item.dest }}'

---
# Shell completions

- name: Check completion source files exist
  ansible.builtin.stat:
    path: '{{ dotfiles_dir }}/{{ item.src }}'
  register: completion_src_check
  loop: '{{ completions }}'
  loop_control:
    label: '{{ item.src }}'

- name: Create symlinks for completions
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/{{ item.item.src }}'
    dest: '{{ home_dir }}/{{ item.item.dest }}'
    state: link
    force: '{{ force_symlinks }}'
  when:
    - not dry_run
    - item.stat.exists
  loop: '{{ completion_src_check.results }}'
  loop_control:
    label: '{{ item.item.dest }}'

---
# Utility directories (bin)

- name: Check utility source directories exist
  ansible.builtin.stat:
    path: '{{ dotfiles_dir }}/{{ item.src }}'
  register: utility_src_check
  loop: '{{ utility_dirs }}'
  loop_control:
    label: '{{ item.src }}'

- name: Create symlinks for utility directories
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/{{ item.item.src }}'
    dest: '{{ home_dir }}/{{ item.item.dest }}'
    state: link
    force: '{{ force_symlinks }}'
  when:
    - not dry_run
    - item.stat.exists
  loop: '{{ utility_src_check.results }}'
  loop_control:
    label: '{{ item.item.dest }}'

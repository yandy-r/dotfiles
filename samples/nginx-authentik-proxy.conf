# Increase buffer size for large headers
# This is needed only if you get 'upstream sent too big header while reading response
# header from upstream' error when trying to access an application protected by goauthentik
proxy_buffers 8 16k;
proxy_buffer_size 32k;

location / {
  # Put your proxy_pass to your application here
  proxy_pass $forward_scheme://$server:$port;
  # #########################################
  # CUSTOM - START Websocket behind authenticated proxy
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  # END Websockets FIX
  # #########################################

  # authentik-specific config
  auth_request /outpost.goauthentik.io/auth/nginx;
  error_page 401 = @goauthentik_proxy_signin;
  auth_request_set $auth_cookie $upstream_http_set_cookie;
  add_header Set-Cookie $auth_cookie;

  # translate headers from the outposts back to the actual upstream
  auth_request_set $authentik_username $upstream_http_x_authentik_username;
  auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
  auth_request_set $authentik_email $upstream_http_x_authentik_email;
  auth_request_set $authentik_name $upstream_http_x_authentik_name;
  auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

  # optional headers
  # auth_request_set $authentik_jwt $upstream_http_x_authentik_jwt;
  # auth_request_set $authentik_jwks $upstream_http_x_authentik_jwks;
  # auth_request_set $authentik_outpost $upstream_http_x_authentik_outpost;
  # auth_request_set $authentik_provider $upstream_http_x_authentik_provider;
  # auth_request_set $authentik_app $upstream_http_x_authentik_app;
  # auth_request_set $authentik_version $upstream_http_x_authentik_version;

  proxy_set_header X-authentik-username $authentik_username;
  proxy_set_header X-authentik-groups $authentik_groups;
  proxy_set_header X-authentik-email $authentik_email;
  proxy_set_header X-authentik-name $authentik_name;
  proxy_set_header X-authentik-uid $authentik_uid;

  # optional headers
  # proxy_set_header X-authentik-jwt $authentik_jwt;
  # proxy_set_header X-authentik-jwks $authentik_jwks;
  # proxy_set_header X-authentik-outpost $authentik_outpost;
  # proxy_set_header X-authentik-provider $authentik_provider;
  # proxy_set_header X-authentik-app $authentik_app;
  # proxy_set_header X-authentik-version $authentik_version;

  # This section should be uncommented when the "Send HTTP Basic authentication" option
  # is enabled in the proxy provider
  auth_request_set $authentik_auth $upstream_http_authorization;
  proxy_set_header Authorization $authentik_auth;
}

# all requests to /outpost.goauthentik.io must be accessible without authentication
location /outpost.goauthentik.io {
  # ################################
  #  CHANGE IP TO AUTHENTIK IP here.
  proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
  # ################################
  # ensure the host of this vserver matches your external URL you've configured
  # in authentik
  proxy_set_header Host $host;
  proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
  add_header Set-Cookie $auth_cookie;
  auth_request_set $auth_cookie $upstream_http_set_cookie;

  # required for POST requests to work
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
}

# Special location for when the /auth endpoint returns a 401,
# redirect to the /start URL which initiates SSO
location @goauthentik_proxy_signin {
  internal;
  add_header Set-Cookie $auth_cookie;
  return 302 /outpost.goauthentik.io/start?rd=$request_uri;
  # For domain level, use the below error_page to redirect to your authentik server with the full redirect path
  # return 302 https://authentik.company/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}

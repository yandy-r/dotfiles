name: Secrets policy

# Secrets live in 1Password; repos commit only op:// reference templates
# (YAN-2498). scripts/secrets-policy-check.sh fails on the retired
# encrypted-env tool, its key variables and key file, tracked env files, and
# op/*.env templates that hold literal values. No path filter: a reference can
# land in any file. Needs no secrets of its own.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Secrets policy
        run: scripts/secrets-policy-check.sh

name: Shell

# Shell axis, two jobs:
#   - shellcheck: runs shellcheck through the repo's single style dispatcher
#     (bin/lint.sh --shell -> `shellcheck --severity=warning` over every tracked
#     *.sh), so CI and `npm run lint` cannot drift apart. Fedora's provisioning
#     correctness lives as much in common/ and bin/ as it does in Go, and
#     neither was gated by any workflow before.
#   - regression: runs the hermetic shell regression scripts (scripts/test-*.sh
#     for the local-overrides hook, shell parity, the bash prompt, the startup
#     cache, the platform predicates and the startup smoke driver) plus the
#     bats-core suite in tests/shell, on Linux and macOS, with zsh installed so
#     the zsh cases run too. On macOS the drivers run under Homebrew bash 5
#     (the prompt test needs bash >= 4.4), and the local-hook, parity and smoke
#     tests run a second time with the shells under test pinned to the system
#     /bin/bash 3.2.

on:
  pull_request:
    paths:
      - '**.sh'
      - 'common/**'
      - 'bin/**'
      - 'bash/**'
      - 'zsh/**'
      - 'shellcheck/**'
      - 'tests/**'
      - '.github/workflows/shell.yml'
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - 'common/**'
      - 'bin/**'
      - 'bash/**'
      - 'zsh/**'
      - 'shellcheck/**'
      - 'tests/**'
      - '.github/workflows/shell.yml'

permissions:
  contents: read

env:
  # Pinned to the version the tree is verified clean against at
  # --severity=warning. Bumping it is a deliberate change that may surface new
  # findings across common/ and bin/, so it does not ride along with unrelated
  # work.
  SHELLCHECK_VERSION: v0.9.0

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install shellcheck
        # Installed from the pinned upstream tarball rather than the runner's
        # preinstalled copy or a third-party action, so both CI systems run the
        # identical binary. Installed under $HOME so no sudo is required.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the repo's shellcheck policy
        # shellcheck reads its rc from $HOME/.shellcheckrc, and on a provisioned
        # machine `dotf link` puts the repo's own shellcheck/shellcheckrc there
        # (internal/symlink/table.go). A CI runner has no such symlink, so
        # without this step CI would enforce a stricter policy than the repo
        # declares and than any developer sees locally. Copying the tracked file
        # keeps a single source of truth for the disabled checks.
        run: install -m 0644 shellcheck/shellcheckrc "$HOME/.shellcheckrc"

      - name: Shellcheck
        run: |
          shellcheck --version
          bin/lint.sh --shell

  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install zsh (Linux)
        # Disabling man-db's trigger and skipping recommends keeps this step at
        # seconds instead of ~2 minutes (the man-db rebuild dominates on
        # ubuntu-24.04 runners).
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh

      - name: Install bash 5 (macOS)
        # macOS ships bash 3.2 as /bin/bash; the drivers need bash >= 4 and the
        # prompt test self-skips below 4.4. Putting Homebrew's bin first makes
        # every later `bash` resolve to bash 5. zsh is preinstalled as /bin/zsh.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Shell versions
        run: |
          bash --version | head -n 1
          zsh --version

      - name: Install bats
        # bats-core from the pinned upstream release tag, installed under
        # $HOME (no sudo, no third-party action), so the Forgejo twin can run
        # the identical install. Local runs use the same commands under /tmp.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Local overrides hook
        run: bash scripts/test-shell-local-hook.sh

      - name: Local overrides hook (system bash 3.2)
        # The shells under test use /bin/bash 3.2, which is what a stock Mac
        # starts; the driver itself still runs under bash 5.
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash bash scripts/test-shell-local-hook.sh

      - name: Shell parity
        run: bash scripts/test-shell-parity.sh

      - name: Shell parity (system bash 3.2)
        # Same as the local-hook 3.2 step: the shells under test are the
        # stock /bin/bash (fabric aliases and startup must work without
        # associative arrays); the driver still runs under bash 5.
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash bash scripts/test-shell-parity.sh

      - name: Bash prompt
        run: bash scripts/test-bash-prompt.sh

      - name: Shell startup cache
        run: bash scripts/test-shell-startup-cache.sh

      - name: Platform predicates
        run: bash scripts/test-platform-predicates.sh

      - name: Shell startup smoke
        run: bash scripts/test-shell-startup-smoke.sh

      - name: Shell startup smoke (system bash 3.2)
        # The rc-file edits (bash_profile non-interactive login sources,
        # per-process reload guards) must hold on the stock /bin/bash too.
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash bash scripts/test-shell-startup-smoke.sh

      - name: Bats suite
        run: bats tests/shell

      - name: Bats suite (system bash 3.2)
        # TEST_BASH is passed through TEST_ENV and detect_os_result, so the
        # reload guards and detect_os seam run under the stock bash as well;
        # bats itself needs bash >= 3.2 only.
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash bats tests/shell
